name: 🙏🏻 Lint Test

on:
  pull_request:
    paths:
      - '**.go'
      - '**.mod'
  workflow_dispatch:

jobs:
  lint:
    name: Lint Test
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/peterjmorgan/*
    steps:

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.5

      - name: Configure private module access
        run: git config --global "url.https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/.insteadOf" "https://github.com/"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout 5m
          working-directory: .