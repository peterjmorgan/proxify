name: 🔨 Release Test

on:
  pull_request:
    paths:
      - '**.go'
      - '**.mod'
  workflow_dispatch:

jobs:
  release-test:
    runs-on: ubuntu-latest-16-cores
    env:
      GOPRIVATE: github.com/peterjmorgan/*
    steps:
      - name: "Check out code"
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.5

      - name: Configure private module access
        run: git config --global "url.https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/.insteadOf" "https://github.com/"

      - name: release test
        uses: goreleaser/goreleaser-action@v6
        with:
          args: "release --clean --snapshot"
          version: latest
          workdir: .